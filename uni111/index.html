    <script>
      // Show content/script errors (e.g. a typo in story/room1.script.md) on screen instead of a blank page.
      window.addEventListener('error', function (e) {
        if (window.__cosmo) return; // game already started: not a load error
        var msg = (e && e.message) || String(e);
        var box = document.getElementById('load-error') || document.body.appendChild(document.createElement('pre'));
        box.id = 'load-error';
        box.style.cssText = 'position:fixed;left:20px;right:20px;top:20px;z-index:99;background:#fff6e3;color:#2a2440;border:3px solid #d95a4d;border-radius:12px;padding:16px;font:15px/1.5 monospace;white-space:pre-wrap';
        box.textContent = 'The game could not start.\n\n' + msg + '\n\nFix the file, save it, and the page will reload.';
      });
    </script>
